name: CI & SonarQube Cloud

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test-and-sonar:
    name: Testes, Cobertura e SonarQube
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage

      - name: Rodar testes com cobertura
        run: |
          python manage.py check
          coverage run --source=pets,petshop --omit="*/migrations/*,*/tests.py,petshop/wsgi.py,petshop/asgi.py,petshop/settings.py" manage.py test pets -v 2
          coverage report -m
          coverage xml -o coverage.xml

      - name: Análise SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}