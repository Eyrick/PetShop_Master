{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}Editar {{ pet.name }} | PetShop Master{% endblock %}

{% block content %}
  <div class="card shadow-sm mx-auto" style="max-width: 560px;">
    <div class="card-body">
      <h1 class="h4 mb-4">Editar {{ pet.name }}</h1>
      <form action="{% url 'update-pet' pet_id=pet.id %}" method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form|crispy }}
        <div class="d-flex justify-content-between mt-4">
          <a href="{% url 'pet-detail' pet.id %}" class="btn btn-outline-secondary">Cancelar</a>
          <button type="submit" class="btn btn-primary">Salvar alterações</button>
        </div>
      </form>
    </div>
  </div>
  {% include "breed_filter.html" %}
{% endblock %}
